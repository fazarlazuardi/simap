<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cetak Notulensi Otomatis BAZNAS</title>

  <!-- Library jsPDF & jsPDF-AutoTable -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
  <!-- Library QR Code Generator -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0f172a;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background-color: #1e293b;
      padding: 40px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      max-width: 500px;
    }
    .btn-download {
      background-color: #046C4E;
      color: #ffffff;
      border: none;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 20px;
      transition: background 0.2s;
    }
    .btn-download:hover {
      background-color: #03543d;
    }
    #qrcode-hidden {
      display: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Sistem Cetak Otomatis Presisi</h2>
    <p style="color: #94a3b8; margin-top: 10px;">
      Engine otomatis mengatur tata letak, pemecahan halaman (page break), dan tinggi tabel secara dinamis.
    </p>
    <button onclick="generateAutomaticPDF()" class="btn-download" id="btnCetak">
      📥 Unduh PDF Otomatis & Rapi
    </button>
  </div>

  <div id="qrcode-hidden"></div>

  <script>
    let qrDataURL = "";
    document.addEventListener("DOMContentLoaded", function() {
      const qrDiv = document.getElementById("qrcode-hidden");
      const qr = new QRCode(qrDiv, {
        text: "VERIFIKASI DIGITAL BAZNAS KAB. TANGERANG\nNomor: 020/BZ-RPT/VIII/2026\nNotulis: Fajar Lazuardi, S.Kom.",
        width: 200,
        height: 200,
        correctLevel: QRCode.CorrectLevel.H
      });

      setTimeout(() => {
        const qrCanvas = qrDiv.querySelector("canvas");
        if (qrCanvas) {
          qrDataURL = qrCanvas.toDataURL("image/png");
        }
      }, 300);
    });

    function generateAutomaticPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({
        orientation: 'portrait',
        unit: 'mm',
        format: 'a4'
      });

      const pageWidth = doc.internal.pageSize.getWidth();
      const pageHeight = doc.internal.pageSize.getHeight();
      const margin = { left: 15, right: 15 };

      // Data dinamis yang bisa diubah/diambil dari database secara otomatis
      const dataNotulensi = {
        nomor: "020/BZ-RPT/VIII/2026",
        agenda: "Evaluasi Program Pelayanan Digital & Tata Kelola Intern BAZNAS Kabupaten Tangerang",
        pimpinan: "1. Drs. H. Achmad Nawawi, M.Si (Ketua)\n2. Haris Syarif Mansyur, S.H, M.H (Wakil Ketua I)\n3. H. Supriyadinata, M.Si (Wakil Ketua III)",
        waktu: "Senin, 10 Agustus 2026 — 10:00 WIB",
        tempat: "Ruang Rapat Utama BAZNAS Kab. Tangerang",
        ringkasan: "Topik Utama Evaluasi Pelayanan Digital, Kepercayaan Muzakki, dan Kesolidan Tim BAZNAS.\n\n" +
                   "• Penguatan sistem arsip internal agar pencatatan dokumen rapat terintegrasi secara digital.\n" +
                   "• Peningkatan kualitas respons layanan muzakki serta peningkatan transparansi penyaluran zakat.\n" +
                   "• Perlunya penataan alur kerja antar unit pelaksana teknis agar tercipta efisiensi kerja.",
        kesimpulan: "1. Digitalisasi Pelayanan & Arsip Adalah Kebutuhan Mendesak.\n" +
                    "2. Kepercayaan Muzakki Adalah Aset Utama BAZNAS Kabupaten Tangerang.\n" +
                    "3. Kesolidan Tim dan Transparansi Menjadi Kunci Keberlanjutan Program.",
        tindakLanjut: "1. Audit & Optimasi Sistem Arsip Digital BAZNAS.\n" +
                     "2. Penyusunan SOP Pelayanan Transparan bagi Muzakki & Mustahik.\n" +
                     "3. Consolidating Internal Unit Pelaksana Teknis secara berkala."
      };

      // 1. KOP SURAT OTOMATIS (Akan dirender ulang di setiap halaman baru)
      const renderKopSurat = () => {
        doc.setFont("times", "bold");
        doc.setFontSize(12);
        doc.text("BADAN AMIL ZAKAT NASIONAL", pageWidth / 2, 16, { align: "center" });
        doc.setFontSize(13);
        doc.text("BAZNAS KABUPATEN TANGERANG", pageWidth / 2, 22, { align: "center" });

        doc.setFont("times", "normal");
        doc.setFontSize(8.5);
        doc.text("Gedung Islamic Center, Jl. Islamic Center No. 01 Citra Raya, Panongan - Tangerang", pageWidth / 2, 27, { align: "center" });

        doc.setLineWidth(0.8);
        doc.line(15, 31, pageWidth - 15, 31);
        doc.setLineWidth(0.2);
        doc.line(15, 32, pageWidth - 15, 32);
      };

      // 2. FUNGSI TANDA TANGAN OTOMATIS (Mengecek sisa ruang halaman)
      const cekDanRenderTandaTangan = () => {
        const tinggiDibutuhkan = 45; // Estimasi tinggi area tanda tangan dalam mm
        const sisaRuang = pageHeight - doc.lastAutoTable.finalY;

        // Jika sisa ruang di halaman tidak cukup untuk tanda tangan, otomatis buat halaman baru
        if (sisaRuang < tinggiDibutuhkan) {
          doc.addPage();
          renderKopSurat();
          doc.lastAutoTable = { finalY: 35 }; // Reset posisi Y setelah header di halaman baru
        }

        let startY = doc.lastAutoTable.finalY + 10;
        const posX = 140;

        doc.setFont("times", "normal");
        doc.setFontSize(10);
        doc.text("Tangerang, 10 Agustus 2026", posX + 25, startY, { align: "center" });
        doc.text("Notulis Rapat,", posX + 25, startY + 5, { align: "center" });

        if (qrDataURL) {
          doc.addImage(qrDataURL, "PNG", posX + 12, startY + 7, 26, 26);
        }

        doc.setFont("times", "bold");
        doc.text("Fajar Lazuardi, S.Kom.", posX + 25, startY + 38, { align: "center" });
        
        doc.setLineWidth(0.3);
        doc.line(posX + 5, startY + 39, posX + 45, startY + 39);

        doc.setFont("times", "italic");
        doc.setFontSize(7.5);
        doc.text("Dokumen Ditandatangani Secara Digital", posX + 25, startY + 43, { align: "center" });
      };

      // --- EKsekusi Halaman 1: Notulensi Utama ---
      renderKopSurat();

      // Tabel Metadata Otomatis
      doc.autoTable({
        startY: 38,
        margin: margin,
        theme: 'plain',
        styles: { font: 'times', fontSize: 10, cellPadding: 2, textColor: [0, 0, 0] },
        body: [
          ['Dokumen / Perihal', ':', 'NOTULENSI & RISALAH RAPAT INTERNAL'],
          ['Nomor Notulensi', ':', dataNotulensi.nomor],
          ['Agenda Rapat', ':', dataNotulensi.agenda],
          ['Pimpinan Rapat', ':', dataNotulensi.pimpinan],
          ['Hari, Tanggal & Jam', ':', dataNotulensi.waktu],
          ['Tempat / Ruang', ':', dataNotulensi.tempat]
        ],
        columnStyles: {
          0: { cellWidth: 45, fontStyle: 'bold' },
          1: { cellWidth: 5, halign: 'center' },
          2: { cellWidth: 'auto' }
        }
      });

      // Array Konten Otomatis (Otomatis menyesuaikan tinggi teks dan terpecah jika melewati batas halaman)
      const blokKonten = [
        { title: '1. RINGKASAN PEMBAHASAN & RISALAH RAPAT', content: dataNotulensi.ringkasan },
        { title: '2. KESIMPULAN & KEPUTUSAN RAPAT', content: dataNotulensi.kesimpulan },
        { title: '3. RENCANA TINDAK LANJUT (ACTION PLAN)', content: dataNotulensi.tindakLanjut }
      ];

      blokKonten.forEach((item) => {
        doc.autoTable({
          startY: doc.lastAutoTable.finalY + 4,
          margin: margin,
          theme: 'grid',
          head: [[item.title]],
          body: [[item.content]],
          headStyles: { font: 'times', fontStyle: 'bold', fillColor: [241, 245, 249], textColor: [0, 0, 0], fontSize: 10 },
          styles: { font: 'times', fontSize: 10, cellPadding: 3, textColor: [0, 0, 0], halign: 'justify' },
          // Fitur otomatis bawaan plugin untuk memecah sel panjang antar halaman dengan aman
          rowPageBreak: 'auto', 
          bodyStyles: { valign: 'top' }
        });
      });

      // Panggil Tanda Tangan Halaman 1 secara otomatis (pindah halaman jika tidak muat)
      cekDanRenderTandaTangan();


      // --- EKsekusi Halaman 2: Daftar Presensi Otomatis ---
      doc.addPage();
      renderKopSurat();

      doc.autoTable({
        startY: 38,
        margin: margin,
        theme: 'plain',
        styles: { font: 'times', fontSize: 10, cellPadding: 2, textColor: [0, 0, 0] },
        body: [
          ['Dokumen', ':', 'DAFTAR KEHADIRAN / PRESENSI PESERTA RAPAT'],
          ['Agenda', ':', dataNotulensi.agenda]
        ],
        columnStyles: {
          0: { cellWidth: 45, fontStyle: 'bold' },
          1: { cellWidth: 5, halign: 'center' },
          2: { cellWidth: 'auto' }
        }
      });

      // Contoh Data Peserta (Otomatis bertambah panjang ke bawah jika datanya banyak)
      const daftarPeserta = [
        ['1', 'Drs. H. Achmad Nawawi, M.Si', 'Ketua BAZNAS', '[ HADIR ]'],
        ['2', 'Haris Syarif Mansyur, S.H, M.H', 'Wakil Ketua I', '[ HADIR ]'],
        ['3', 'H. Supriyadinata, M.Si', 'Wakil Ketua III', '[ HADIR ]'],
        ['4', 'Abdul Qodir, S.T, M.Si', 'Staff Pelaksana', '[ HADIR ]'],
        ['5', 'Ahmad Nawawi, S.Pd', 'Kabid II', '[ HADIR ]'],
        ['6', 'Fajar Lazuardi, S.Kom.', 'Staf Pelaksana IT', '[ HADIR ]']
      ];

      doc.autoTable({
        startY: doc.lastAutoTable.finalY + 4,
        margin: margin,
        head: [['No', 'Nama Pegawai / Amil', 'Jabatan / Unit Kerja', 'Status']],
        body: daftarPeserta,
        theme: 'grid',
        headStyles: { font: 'times', fontStyle: 'bold', fillColor: [241, 245, 249], textColor: [0, 0, 0], halign: 'center' },
        styles: { font: 'times', fontSize: 9.5, cellPadding: 2.5, textColor: [0, 0, 0] },
        columnStyles: {
          0: { halign: 'center', cellWidth: 12 },
          1: { fontStyle: 'bold', cellWidth: 75 },
          2: { cellWidth: 60 },
          3: { halign: 'center', cellWidth: 33 }
        },
        // Jika tabel presensi sangat panjang, header tabel akan otomatis tercetak di halaman berikutnya
        showHead: 'everyPage' 
      });

      // Panggil Tanda Tangan untuk Halaman Presensi secara otomatis
      cekDanRenderTandaTangan();

      // Download file PDF secara otomatis
      doc.save("Notulensi_BAZNAS_Kab_Tangerang.pdf");
    }
  </script>
</body>
</html>
