{% extends 'layouts/base.html' %}

{% block title %}Edit Pegawai - BAZNAS{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col-md-12">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="{% url 'users:employee_list' %}" class="text-decoration-none text-primary">Karyawan</a></li>
                <li class="breadcrumb-item active" aria-current="page">Edit Pegawai</li>
            </ol>
        </nav>
        <h4 class="fw-bold">Edit Data Pegawai: {{ employee.full_name }}</h4>
        <p class="text-secondary small">Perbarui informasi detail kepegawaian dan status aktif pegawai.</p>
    </div>
</div>

<div class="row justify-content-center">
    <div class="col-lg-10">
        <div class="card border-0 shadow-sm p-4">
            <form method="post">
                {% csrf_token %}
                
                <div class="row">
                    <div class="col-md-4 mb-4">
                        <label for="nip" class="form-label fw-bold">NIP / NIK <span class="text-danger">*</span></label>
                        <input type="text" class="form-control custom-input" id="nip" name="nip" value="{{ employee.nip }}" required>
                    </div>
                    <div class="col-md-8 mb-4">
                        <label for="full_name" class="form-label fw-bold">Nama Lengkap <span class="text-danger">*</span></label>
                        <input type="text" class="form-control custom-input" id="full_name" name="full_name" value="{{ employee.full_name }}" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-4">
                        <label for="position" class="form-label fw-bold">Jabatan <span class="text-danger">*</span></label>
                        <input type="text" class="form-control custom-input" id="position" name="position" value="{{ employee.position }}" required>
                    </div>
                    <div class="col-md-6 mb-4">
                        <label for="dept_relation" class="form-label fw-bold">Bidang / Bagian <span class="text-danger">*</span></label>
                        <select class="form-select custom-input" id="dept_relation" name="dept_relation" required>
                            <option value="" disabled>Pilih Bidang...</option>
                            {% for dept in departments %}
                            <option value="{{ dept.id }}" {% if employee.dept_relation.id == dept.id %}selected{% endif %}>{{ dept.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-4 mb-4">
                        <label for="gender" class="form-label fw-bold">Jenis Kelamin</label>
                        <select class="form-select custom-input" id="gender" name="gender">
                            <option value="L" {% if employee.gender == 'L' %}selected{% endif %}>Laki-laki</option>
                            <option value="P" {% if employee.gender == 'P' %}selected{% endif %}>Perempuan</option>
                        </select>
                    </div>
                    <div class="col-md-4 mb-4">
                        <label for="phone_number" class="form-label fw-bold">No. WhatsApp</label>
                        <input type="text" class="form-control custom-input" id="phone_number" name="phone_number" value="{{ employee.phone_number|default:'' }}">
                    </div>
                    <div class="col-md-4 mb-4">
                        <label for="email" class="form-label fw-bold">Email</label>
                        <input type="email" class="form-control custom-input" id="email" name="email" value="{{ employee.email|default:'' }}">
                    </div>
                </div>

                <div class="mb-4">
                    <div class="form-check form-switch mt-2">
                        <input class="form-check-input" type="checkbox" role="switch" id="is_active" name="is_active" {% if employee.is_active %}checked{% endif %}>
                        <label class="form-check-label fw-bold small" for="is_active">Pegawai Aktif</label>
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-3 mt-4 pt-3 border-top">
                    <a href="{% url 'users:employee_list' %}" class="btn btn-light px-4 fw-semibold">Batal</a>
                    <button type="submit" class="btn btn-primary px-5 shadow-sm fw-bold">
                        <i class="bi bi-save2-fill me-2"></i> Simpan Perubahan
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<style>
    .custom-input { height: 52px; border-radius: 12px; border: 1px solid #E5E7EB; }
</style>
{% endblock %}
