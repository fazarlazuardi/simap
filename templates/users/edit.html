{% extends 'layouts/base.html' %}

{% block title %}Edit Pengguna - BAZNAS{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col-md-12">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="{% url 'users:list' %}" class="text-decoration-none text-primary">User Management</a></li>
                <li class="breadcrumb-item active" aria-current="page">Edit Pengguna</li>
            </ol>
        </nav>
        <h4 class="fw-bold">Edit Data: {{ user_obj.username }}</h4>
        <p class="text-secondary small">Perbarui informasi akun dan hak akses pengguna.</p>
    </div>
</div>

<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card border-0 shadow-sm p-4">
            <form method="post">
                {% csrf_token %}
                
                <div class="row">
                    <div class="col-md-6 mb-4">
                        <label for="username" class="form-label">Username <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="username" name="username" value="{{ user_obj.username }}" required>
                    </div>
                    <div class="col-md-6 mb-4">
                        <label for="email" class="form-label">Alamat Email <span class="text-danger">*</span></label>
                        <input type="email" class="form-control" id="email" name="email" value="{{ user_obj.email }}" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-4">
                        <label for="first_name" class="form-label">Nama Depan</label>
                        <input type="text" class="form-control" id="first_name" name="first_name" value="{{ user_obj.first_name }}">
                    </div>
                    <div class="col-md-6 mb-4">
                        <label for="last_name" class="form-label">Nama Belakang</label>
                        <input type="text" class="form-control" id="last_name" name="last_name" value="{{ user_obj.last_name }}">
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-4">
                        <label for="role" class="form-label">Role Akses <span class="text-danger">*</span></label>
                        <select class="form-select" id="role" name="role" required style="height: 52px; border-radius: 12px;">
                            {% for code, name in roles %}
                            <option value="{{ code }}" {% if user_obj.role == code %}selected{% endif %}>{{ name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6 mb-4">
                        <label for="password" class="form-label">Password Baru (Opsional)</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Kosongkan jika tidak ingin ganti">
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-3 mt-4">
                    <a href="{% url 'users:list' %}" class="btn btn-light px-4 fw-semibold" style="height: 52px; border-radius: 12px; display: flex; align-items: center;">Batal</a>
                    <button type="submit" class="btn btn-primary px-5">Simpan Perubahan</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
