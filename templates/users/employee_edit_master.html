{% extends 'layouts/base.html' %}

{% block title %}Edit Karyawan - BAZNAS{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col-md-12">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="{% url 'users:employee_list' %}" class="text-decoration-none text-primary">Karyawan</a></li>
                <li class="breadcrumb-item"><a href="{% url 'users:employee_detail' employee.pk %}" class="text-decoration-none text-primary">Detail</a></li>
                <li class="breadcrumb-item active" aria-current="page">Edit</li>
            </ol>
        </nav>
        <h4 class="fw-bold">Edit Data: {{ employee.full_name }}</h4>
    </div>
</div>

<div class="row justify-content-center">
    <div class="col-lg-10">
        <div class="card border-0 shadow-sm p-4">
            <form method="post">
                {% csrf_token %}
                <h5 class="fw-bold mb-4 border-bottom pb-2">Data Pegawai</h5>
                <div class="row">
                    <div class="col-md-4 mb-4">
                        <label class="form-label fw-bold">NIP / NIK <span class="text-danger">*</span></label>
                        <input type="text" class="form-control custom-input" name="nip" value="{{ employee.nip }}" required>
                    </div>
                    <div class="col-md-8 mb-4">
                        <label class="form-label fw-bold">Nama Lengkap <span class="text-danger">*</span></label>
                        <input type="text" class="form-control custom-input" name="full_name" value="{{ employee.full_name }}" required>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-4">
                        <label class="form-label fw-bold">Jabatan <span class="text-danger">*</span></label>
                        <input type="text" class="form-control custom-input" name="position" value="{{ employee.position }}" required>
                    </div>
                    <div class="col-md-6 mb-4">
                        <label class="form-label fw-bold">Bidang / Bagian</label>
                        <select class="form-select custom-input" name="dept_relation">
                            <option value="">Pilih Bidang...</option>
                            {% for dept in departments %}
                            <option value="{{ dept.id }}" {% if employee.dept_relation.id == dept.id %}selected{% endif %}>{{ dept.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-4 mb-4">
                        <label class="form-label fw-bold">Jenis Kelamin</label>
                        <select class="form-select custom-input" name="gender">
                            <option value="L" {% if employee.gender == 'L' %}selected{% endif %}>Laki-laki</option>
                            <option value="P" {% if employee.gender == 'P' %}selected{% endif %}>Perempuan</option>
                        </select>
                    </div>
                    <div class="col-md-4 mb-4">
                        <label class="form-label fw-bold">No. WhatsApp</label>
                        <input type="text" class="form-control custom-input" name="phone_number" value="{{ employee.phone_number|default:'' }}">
                    </div>
                    <div class="col-md-4 mb-4">
                        <label class="form-label fw-bold">Email</label>
                        <input type="email" class="form-control custom-input" name="email" value="{{ employee.email|default:'' }}">
                    </div>
                </div>
                <div class="mb-4">
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" role="switch" name="is_active" {% if employee.is_active %}checked{% endif %}>
                        <label class="form-check-label fw-bold">Pegawai Aktif</label>
                    </div>
                </div>

                {% if user_account %}
                <h5 class="fw-bold mb-4 border-bottom pb-2 mt-5">Akun Sistem</h5>
                <div class="row">
                    <div class="col-md-6 mb-4">
                        <label class="form-label fw-bold">Username <span class="text-danger">*</span></label>
                        <input type="text" class="form-control custom-input" name="username" value="{{ user_account.username }}" required>
                    </div>
                    <div class="col-md-6 mb-4">
                        <label class="form-label fw-bold">Role <span class="text-danger">*</span></label>
                        <select class="form-select custom-input" name="role" required>
                            {% for code, name in roles %}
                            <option value="{{ code }}" {% if user_account.role == code %}selected{% endif %}>{{ name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-4">
                        <label class="form-label fw-bold">Nama Depan</label>
                        <input type="text" class="form-control custom-input" name="first_name" value="{{ user_account.first_name }}">
                    </div>
                    <div class="col-md-6 mb-4">
                        <label class="form-label fw-bold">Nama Belakang</label>
                        <input type="text" class="form-control custom-input" name="last_name" value="{{ user_account.last_name }}">
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-4">
                        <label class="form-label fw-bold">Password Baru</label>
                        <input type="password" class="form-control custom-input" name="password" placeholder="Kosongkan jika tidak ingin ganti">
                    </div>
                    <div class="col-md-6 mb-4">
                        <div class="form-check form-switch mt-4">
                            <input class="form-check-input" type="checkbox" role="switch" name="is_active_account" {% if user_account.is_active_account %}checked{% endif %}>
                            <label class="form-check-label fw-bold">Akun Aktif</label>
                        </div>
                    </div>
                </div>
                {% endif %}

                <div class="d-flex justify-content-end gap-3 mt-4 pt-3 border-top">
                    <a href="{% url 'users:employee_detail' employee.pk %}" class="btn btn-light px-4 fw-semibold">Batal</a>
                    <button type="submit" class="btn btn-primary px-5 shadow-sm fw-bold">
                        <i class="bi bi-save me-2"></i> Simpan Perubahan
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<style>
    .custom-input { height: 52px; border-radius: 12px; border: 1px solid #E5E7EB; }
</style>
{% endblock %}
