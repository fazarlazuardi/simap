<!-- ⚡ ENTERPRISE DYNAMIC RESPONSIVE DATA TABLE COMPONENT ⚡ -->
<!-- Mode Desktop Table: Touch pan & horizontal scroll enabled for mobile swipe (overflow-x-auto touch-pan-x) -->
<!-- Mode Mobile Card Grid: Stacked cards with zero cutoff/overflow -->

<div class="w-full space-y-4 max-w-full overflow-hidden">

  <!-- 1. RESPONSIVE TABLE WRAPPER (Dapat digeser horizontal di Mobile & Tablet jika layar sempit) -->
  <div class="hidden md:block w-full overflow-x-auto touch-pan-x custom-scrollbar rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 shadow-md">
    <table class="w-full min-w-[640px] md:min-w-full text-left border-collapse text-sm">
      <thead class="bg-slate-900 text-slate-100 dark:bg-slate-950 dark:text-slate-200 uppercase text-xs font-mono tracking-wider border-b border-slate-800">
        <tr>
          {% block table_header %}
          <th class="py-3.5 px-4 font-extrabold whitespace-nowrap">#</th>
          <th class="py-3.5 px-4 font-extrabold whitespace-nowrap">Nomor & Judul</th>
          <th class="py-3.5 px-4 font-extrabold whitespace-nowrap">Pemohon / Tanggal</th>
          <th class="py-3.5 px-4 font-extrabold text-center whitespace-nowrap">Status</th>
          <th class="py-3.5 px-4 font-extrabold text-end whitespace-nowrap">Aksi</th>
          {% endblock %}
        </tr>
      </thead>
      <tbody class="divide-y divide-slate-200 dark:divide-slate-800 font-medium text-slate-700 dark:text-slate-200">
        {% block table_body %}
        <!-- Baris data contoh / override template -->
        {% endblock %}
      </tbody>
    </table>
  </div>

  <!-- 2. MOBILE CARD GRID (Tampilan Kartu Ringkas Responsif tanpa Terpotong) -->
  <div class="block md:hidden space-y-3.5 w-full">
    {% block mobile_card_grid %}
    <!-- Item card mobile override template -->
    {% endblock %}
  </div>

</div>
