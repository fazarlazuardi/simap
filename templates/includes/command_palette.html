<!-- Global Command Palette Modal (Ctrl + K) -->
<div x-data x-show="$store.commandPalette.isOpen" 
     x-cloak
     style="display: none !important;"
     @click.away="$store.commandPalette.close()"
     class="command-palette-backdrop">

    <div class="command-palette-modal" @click.stop>
        <div class="position-relative">
            <i class="bi bi-search position-absolute top-50 start-0 translate-middle-y ms-3 text-muted fs-5"></i>
            <input type="text" 
                   id="commandPaletteInput"
                   x-model="$store.commandPalette.query"
                   class="command-input ps-5 pe-4" 
                   placeholder="Ketik nama pegawai, nomor surat, atau pintasan menu... (Tekan ESC untuk keluar)">
            <button type="button" @click="$store.commandPalette.close()" class="btn-close position-absolute top-50 end-0 translate-middle-y me-3"></button>
        </div>

        <div class="p-3" style="max-height: 380px; overflow-y: auto;">
            <!-- Category: Quick Navigation Shortcuts -->
            <div class="text-uppercase fw-bold text-muted mb-2 px-2" style="font-size: 0.7rem; letter-spacing: 0.5px;">Pintasan Utama</div>
            <div class="d-flex flex-column gap-1 mb-3">
                <a href="{% url 'users:dashboard' %}" class="command-option-item">
                    <div class="d-flex align-items-center gap-2">
                        <i class="bi bi-grid-1x2-fill text-emerald me-1"></i>
                        <span class="fw-medium">Dashboard Overview</span>
                    </div>
                    <span class="badge bg-light text-dark rounded-pill px-2" style="font-size: 0.65rem;">Navigasi</span>
                </a>
                <a href="{% url 'dispositions:list' %}" class="command-option-item">
                    <div class="d-flex align-items-center gap-2">
                        <i class="bi bi-send-fill text-primary me-1"></i>
                        <span class="fw-medium">Kelola Disposisi Surat</span>
                    </div>
                    <span class="badge bg-light text-dark rounded-pill px-2" style="font-size: 0.65rem;">Navigasi</span>
                </a>
                <a href="{% url 'surat_tugas:list' %}" class="command-option-item">
                    <div class="d-flex align-items-center gap-2">
                        <i class="bi bi-file-earmark-text-fill text-success me-1"></i>
                        <span class="fw-medium">Daftar Surat Tugas</span>
                    </div>
                    <span class="badge bg-light text-dark rounded-pill px-2" style="font-size: 0.65rem;">Navigasi</span>
                </a>
                <a href="{% url 'sppd_service:list' %}" class="command-option-item">
                    <div class="d-flex align-items-center gap-2">
                        <i class="bi bi-car-front-fill text-warning me-1"></i>
                        <span class="fw-medium">Perjalanan Dinas (SPPD)</span>
                    </div>
                    <span class="badge bg-light text-dark rounded-pill px-2" style="font-size: 0.65rem;">Navigasi</span>
                </a>
            </div>

            <!-- Quick Actions -->
            <div class="text-uppercase fw-bold text-muted mb-2 px-2" style="font-size: 0.7rem; letter-spacing: 0.5px;">Aksi Cepat</div>
            <div class="d-flex flex-column gap-1">
                <a href="{% url 'surat_tugas:create' %}" class="command-option-item">
                    <div class="d-flex align-items-center gap-2">
                        <i class="bi bi-plus-circle-fill text-emerald me-1"></i>
                        <span class="fw-medium">Buat Surat Tugas Baru</span>
                    </div>
                    <span class="badge bg-emerald-subtle text-emerald rounded-pill px-2" style="font-size: 0.65rem;">Form Baru</span>
                </a>
                <a href="{% url 'reports:rekap_bantuan' %}" class="command-option-item">
                    <div class="d-flex align-items-center gap-2">
                        <i class="bi bi-pie-chart-fill text-info me-1"></i>
                        <span class="fw-medium">Lihat Rekap Penanganan Bantuan</span>
                    </div>
                    <span class="badge bg-info-subtle text-info rounded-pill px-2" style="font-size: 0.65rem;">Laporan</span>
                </a>
            </div>
        </div>

        <div class="p-2 border-top bg-body-tertiary d-flex justify-content-between align-items-center text-muted px-3" style="font-size: 0.75rem;">
            <span><i class="bi bi-keyboard me-1"></i> Tekan <strong>Esc</strong> untuk menutup</span>
            <span>SIMAP Enterprise OmniSearch</span>
        </div>
    </div>
</div>
