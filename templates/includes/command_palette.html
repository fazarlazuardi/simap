<!-- Global Command Palette Modal (Ctrl + K) -->
<div x-data x-show="$store.commandPalette.isOpen" 
     x-cloak
     x-transition:enter="transition ease-out duration-200"
     x-transition:enter-start="opacity-0"
     x-transition:enter-end="opacity-100"
     x-transition:leave="transition ease-in duration-150"
     x-transition:leave-start="opacity-100"
     x-transition:leave-end="opacity-0"
     @click.away="$store.commandPalette.close()"
     class="fixed inset-0 z-[1080] bg-slate-950/60 backdrop-blur-md flex items-start justify-center pt-16 sm:pt-24 px-4">

    <div class="w-full max-w-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-2xl overflow-hidden transition-all" @click.stop>
        <div class="relative border-b border-slate-200 dark:border-slate-800">
            <i class="bi bi-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-lg"></i>
            <input type="text" 
                   id="commandPaletteInput"
                   x-model="$store.commandPalette.query"
                   class="w-full pl-12 pr-12 py-4 bg-transparent text-slate-900 dark:text-slate-100 placeholder-slate-400 focus:outline-none text-sm font-medium" 
                   placeholder="Ketik pencarian surat, nama amil, atau navigasi modul...">
            <button type="button" @click="$store.commandPalette.close()" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                <i class="bi bi-x-lg"></i>
            </button>
        </div>

        <div class="p-3 max-h-[380px] overflow-y-auto custom-scrollbar">
            <!-- Category: Quick Navigation Shortcuts -->
            <div class="text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-2 px-2 font-mono">Pintasan Utama</div>
            <div class="flex flex-col gap-1 mb-3">
                <a href="{% url 'users:dashboard' %}" class="flex items-center justify-between p-2.5 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800/80 text-slate-700 dark:text-slate-200 text-decoration-none group transition-all">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-lg bg-emerald-500/10 text-emerald-500 flex items-center justify-center">
                            <i class="bi bi-grid-1x2-fill"></i>
                        </div>
                        <span class="font-medium text-sm">Dashboard Overview</span>
                    </div>
                    <span class="px-2 py-0.5 rounded-full text-[11px] font-mono bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400">Navigasi</span>
                </a>
                <a href="{% url 'dispositions:list' %}" class="flex items-center justify-between p-2.5 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800/80 text-slate-700 dark:text-slate-200 text-decoration-none group transition-all">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-lg bg-amber-500/10 text-amber-500 flex items-center justify-center">
                            <i class="bi bi-send-fill"></i>
                        </div>
                        <span class="font-medium text-sm">Kelola Disposisi Surat</span>
                    </div>
                    <span class="px-2 py-0.5 rounded-full text-[11px] font-mono bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400">Navigasi</span>
                </a>
                <a href="{% url 'surat_tugas:list' %}" class="flex items-center justify-between p-2.5 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800/80 text-slate-700 dark:text-slate-200 text-decoration-none group transition-all">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-lg bg-sky-500/10 text-sky-500 flex items-center justify-center">
                            <i class="bi bi-file-earmark-text-fill"></i>
                        </div>
                        <span class="font-medium text-sm">Daftar Surat Tugas</span>
                    </div>
                    <span class="px-2 py-0.5 rounded-full text-[11px] font-mono bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400">Navigasi</span>
                </a>
                <a href="{% url 'sppd_service:list' %}" class="flex items-center justify-between p-2.5 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800/80 text-slate-700 dark:text-slate-200 text-decoration-none group transition-all">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-lg bg-emerald-500/10 text-emerald-500 flex items-center justify-center">
                            <i class="bi bi-car-front-fill"></i>
                        </div>
                        <span class="font-medium text-sm">Perjalanan Dinas (SPPD)</span>
                    </div>
                    <span class="px-2 py-0.5 rounded-full text-[11px] font-mono bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400">Navigasi</span>
                </a>
            </div>

            <!-- Quick Actions -->
            <div class="text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-2 px-2 font-mono">Aksi Cepat</div>
            <div class="flex flex-col gap-1">
                <a href="{% url 'surat_tugas:create' %}" class="flex items-center justify-between p-2.5 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800/80 text-slate-700 dark:text-slate-200 text-decoration-none group transition-all">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-lg bg-emerald-500/10 text-emerald-500 flex items-center justify-center">
                            <i class="bi bi-plus-circle-fill"></i>
                        </div>
                        <span class="font-medium text-sm">Buat Surat Tugas Baru</span>
                    </div>
                    <span class="px-2 py-0.5 rounded-full text-[11px] font-mono bg-emerald-500/10 text-emerald-600 dark:text-emerald-400">Form Baru</span>
                </a>
                <a href="{% url 'reports:rekap_bantuan' %}" class="flex items-center justify-between p-2.5 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800/80 text-slate-700 dark:text-slate-200 text-decoration-none group transition-all">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-lg bg-indigo-500/10 text-indigo-500 flex items-center justify-center">
                            <i class="bi bi-pie-chart-fill"></i>
                        </div>
                        <span class="font-medium text-sm">Lihat Rekap Penanganan Bantuan</span>
                    </div>
                    <span class="px-2 py-0.5 rounded-full text-[11px] font-mono bg-indigo-500/10 text-indigo-600 dark:text-indigo-400">Laporan</span>
                </a>
            </div>
        </div>

        <div class="p-3 border-t border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-900/60 flex justify-between items-center text-slate-400 text-xs font-mono">
            <span><i class="bi bi-keyboard me-1"></i> Tekan <kbd class="px-1.5 py-0.5 rounded bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300">Esc</kbd> untuk menutup</span>
            <span>SIMAP OmniSearch</span>
        </div>
    </div>
</div>
