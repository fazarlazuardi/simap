<!-- Global Slide-Over Side Drawer Shell -->
<div x-data x-show="$store.drawer.isOpen" 
     x-cloak
     x-transition:enter="transition ease-out duration-300"
     x-transition:enter-start="opacity-0"
     x-transition:enter-end="opacity-100"
     x-transition:leave="transition ease-in duration-200"
     x-transition:leave-start="opacity-100"
     x-transition:leave-end="opacity-0"
     @click="$store.drawer.close()"
     class="drawer-backdrop backdrop-blur-sm bg-slate-950/40 fixed inset-0 z-[1070]"></div>

<div x-data 
     class="slide-over-drawer shadow-2xl border-l border-slate-200 dark:border-slate-800" 
     :class="{ 'open': $store.drawer.isOpen }" 
     x-cloak>
    
    <!-- Drawer Header -->
    <div class="p-4 border-b border-slate-200 dark:border-slate-800 d-flex align-items-center justify-content-between bg-gradient-to-r from-slate-900 to-emerald-950 text-white">
        <div class="d-flex align-items-center gap-3">
            <div class="w-9 h-9 rounded-xl bg-emerald-500/20 text-emerald-400 d-inline-flex align-items-center justify-content-center border border-emerald-500/30">
                <i class="bi bi-layout-sidebar-reverse fs-5"></i>
            </div>
            <div>
                <h5 class="mb-0 fw-bold tracking-tight text-white" x-text="$store.drawer.title">Detail Data</h5>
                <p class="mb-0 text-slate-400 text-xs font-mono" x-text="$store.drawer.subtitle"></p>
            </div>
        </div>
        <button type="button" @click="$store.drawer.close()" class="btn-close btn-close-white opacity-75 hover-opacity-100" aria-label="Close"></button>
    </div>

    <!-- Drawer Body Content -->
    <div class="p-4 overflow-auto flex-grow-1 custom-scrollbar" id="drawerBodyContent" x-html="$store.drawer.contentHtml">
        <div class="text-center py-5 text-muted">
            <div class="spinner-border text-emerald-500 mb-3" role="status"></div>
            <p class="mb-0 font-medium">Memuat detail data SIMAP...</p>
        </div>
    </div>

    <!-- Drawer Footer Actions -->
    <div class="p-3 border-t border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-900/80 d-flex justify-content-end gap-2">
        <button type="button" @click="$store.drawer.close()" class="btn btn-sm btn-outline-secondary rounded-xl px-4 font-bold">
            <i class="bi bi-x-lg me-1"></i> Tutup
        </button>
    </div>
</div>
